<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Images - Image Understanding</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="M21 15l-5-5L5 17" />
        </svg>
        <span>Image Understanding</span>
      </div>
      <nav class="nav">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/download.html" class="nav-link active">Download</a>
        <a href="/jobs.html" class="nav-link">Jobs</a>
        <a href="/images.html" class="nav-link">Images</a>
        <a href="/posts.html" class="nav-link">Posts</a>
        <a href="/ranking.html" class="nav-link">Ranking</a>
      </nav>
    </header>

    <main class="main" id="app">
      <div class="page-header">
        <div>
          <h1 class="page-title">Download Images</h1>
          <p class="page-subtitle">Search Pexels and enqueue images for processing</p>
        </div>
      </div>

      <!-- Search Section -->
      <div class="card mb-4">
        <div class="card-header">
          <h2 class="card-title">Search Pexels</h2>
        </div>
        <div class="card-body">
          <form id="searchForm" class="form-row" style="align-items: flex-end;">
            <div class="form-group" style="flex: 1; min-width: 250px;">
              <label class="form-label" for="searchQuery">Search Query</label>
              <input type="text" class="form-input" id="searchQuery" placeholder="e.g., red fox, wolf, landscape" required>
            </div>
            <div class="form-group" style="width: auto;">
              <label class="form-label" for="searchPerPage">Results per page</label>
              <select class="form-select" id="searchPerPage" style="width: auto; min-width: 100px;">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              Search
            </button>
          </form>
          <div id="searchStatus" class="form-hint" style="margin-top: 8px;"></div>
        </div>
      </div>

      <!-- Search Results -->
      <div class="card" id="resultsCard" style="display: none;">
        <div class="card-header">
          <h2 class="card-title">Search Results</h2>
          <div class="flex items-center gap-4">
            <span id="resultsCount" class="text-center" style="color: var(--fg-muted); font-size: 0.8125rem;"></span>
            <button class="btn btn-primary btn-sm" id="enqueueSelectedBtn" style="display: none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              Enqueue Selected
            </button>
          </div>
        </div>
        <div class="card-body" style="padding: 0;">
          <div class="image-grid" id="imageGrid"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Image Preview Modal -->
  <div class="modal-overlay" id="imageModal" role="dialog" aria-modal="true" aria-labelledby="imageModalTitle">
    <div class="modal" style="max-width: 90vw; max-height: 90vh;">
      <div class="modal-header">
        <h3 class="modal-title" id="imageModalTitle">Image Preview</h3>
        <button class="modal-close" id="imageModalClose" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" style="padding: 0; display: flex; flex-direction: column;" id="imageModalBody">
        <div class="loading">
          <div class="spinner"></div>Loading image...
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';

    const state = {
      searchResults: [],
      selectedImages: new Set(),
      currentQuery: '',
      currentPage: 1,
      loading: false
    };

    function formatTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    // Search Pexels
    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = document.getElementById('searchQuery').value.trim();
      const perPage = document.getElementById('searchPerPage').value;
      const statusEl = document.getElementById('searchStatus');
      const resultsCard = document.getElementById('resultsCard');
      const grid = document.getElementById('imageGrid');
      const countEl = document.getElementById('resultsCount');
      const enqueueSelectedBtn = document.getElementById('enqueueSelectedBtn');

      if (!query) return;

      statusEl.textContent = 'Searching…';
      statusEl.style.color = 'var(--accent)';
      grid.innerHTML = '<div class="loading" style="grid-column: 1/-1;"><div class="spinner"></div>Searching Pexels…</div>';
      resultsCard.style.display = 'block';
      enqueueSelectedBtn.style.display = 'none';

      try {
        const data = await api.searchImages(query);
        state.searchResults = data.photos || data || [];
        state.selectedImages.clear();
        state.currentQuery = query;

        if (!state.searchResults.length) {
          grid.innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1; padding: 40px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <p class="empty-state-title">No results found</p>
          <p class="empty-state-desc">Try a different search term.</p>
        </div>
      `;
          countEl.textContent = '0 results';
          statusEl.textContent = 'No results found';
          statusEl.style.color = 'var(--warning)';
          return;
        }

        renderImageGrid();
        countEl.textContent = `${state.searchResults.length} result${state.searchResults.length !== 1 ? 's' : ''}`;
        enqueueSelectedBtn.style.display = 'inline-flex';
        statusEl.textContent = `Found ${state.searchResults.length} images`;
        statusEl.style.color = 'var(--success)';
      } catch (err) {
        console.error('Search failed:', err);
        grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1; padding: 40px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p class="empty-state-title">Search failed</p>
        <p class="empty-state-desc">${err.message}</p>
      </div>
    `;
        countEl.textContent = 'Error';
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.style.color = 'var(--danger)';
      }
    });

    function renderImageGrid() {
      const grid = document.getElementById('imageGrid');
      grid.innerHTML = state.searchResults.map((photo, idx) => {
        const url = photo.src?.large || photo.src?.original || photo.src?.medium || photo.url;
        const id = photo.id || idx;
        const isSelected = state.selectedImages.has(id);
        return `
      <div class="image-card ${isSelected ? 'selected' : ''}" data-id="${id}" data-url="${url}" style="cursor: pointer; ${isSelected ? 'border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light);' : ''}">
        <img class="image-card-img" src="${url}" alt="${photo.alt || 'Image'}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div style="display:none; width:100%; height:180px; align-items:center; justify-content:center; background:var(--bg); color:var(--fg-subtle); font-size:0.75rem;">Failed to load</div>
        <div class="image-card-body">
          <div class="image-card-title" title="${photo.alt || 'No description'}">${photo.alt || 'Untitled'}</div>
          <div class="image-card-meta">
            <span>📷 ${photo.photographer || 'Unknown'}</span>
            <span>${photo.width}×${photo.height}</span>
          </div>
          <div class="image-card-tags">
            <span class="tag" style="background: ${isSelected ? 'var(--accent)' : 'var(--accent-light)'}; color: ${isSelected ? 'white' : 'var(--accent)'};">${isSelected ? '✓ Selected' : 'Click to select'}</span>
          </div>
        </div>
      </div>
    `;
      }).join('');

      // Click handlers
      grid.querySelectorAll('.image-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          if (state.selectedImages.has(id)) {
            state.selectedImages.delete(id);
          } else {
            state.selectedImages.add(id);
          }
          renderImageGrid();
        });

        // Double-click to preview
        card.addEventListener('dblclick', () => {
          showImageModal(card.dataset.url, card.querySelector('.image-card-title').textContent);
        });
      });
    }

    document.getElementById('enqueueSelectedBtn').addEventListener('click', async () => {
      const urls = state.searchResults
        .filter((_, idx) => state.selectedImages.has(state.searchResults[idx].id || idx))
        .map(p => p.src?.large || p.src?.original || p.src?.medium || p.url)
        .filter(Boolean);

      if (!urls.length) return alert('No images selected');

      await enqueueImages(urls);
    });

    async function enqueueImages(urls) {
      const statusEl = document.getElementById('searchStatus');
      const btn = document.getElementById('enqueueSelectedBtn');

      statusEl.textContent = `Enqueueing ${urls.length} image${urls.length !== 1 ? 's' : ''}…`;
      statusEl.style.color = 'var(--accent)';
      btn.disabled = true;

      try {
        const result = await api.enqueueImages(urls);
        statusEl.textContent = `Success! Batch ${result.batchId.slice(0, 8)}… with ${result.count} image${result.count !== 1 ? 's' : ''} enqueued.`;
        statusEl.style.color = 'var(--success)';
        state.selectedImages.clear();
        renderImageGrid();
      } catch (err) {
        console.error('Enqueue failed:', err);
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.style.color = 'var(--danger)';
      } finally {
        btn.disabled = false;
      }
    }

    // Image Modal
    function showImageModal(url, title) {
      const modal = document.getElementById('imageModal');
      const body = document.getElementById('imageModalBody');
      const titleEl = document.getElementById('imageModalTitle');

      modal.classList.add('open');
      titleEl.textContent = title || 'Image Preview';
      body.innerHTML = `<img src="${url}" alt="${title}" style="max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: var(--radius);" onerror="this.outerHTML='<div class=\'empty-state\'><p class=\'empty-state-title\'>Failed to load image</p></div>'">`;
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('open');
    }

    document.getElementById('imageModalClose').addEventListener('click', closeImageModal);
    document.getElementById('imageModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeImageModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeImageModal();
    });
  </script>

  <style>
    .image-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light), var(--shadow-lg);
    }
  </style>
</body>

</html>
